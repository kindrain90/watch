<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartwatch Theater Viewer (Pro)</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            padding: 10px;
            max-width: 100%;
        }

        h3 {
            margin: 0;
            font-size: 1.1rem;
            color: #63e6be;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            margin-bottom: 10px;
            text-align: center;
        }

        .movie-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .movie-item {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .room-name {
            font-weight: bold;
            font-size: 1rem;
        }

        .status-running {
            color: #63e6be;
        }

        .status-ad {
            color: #ffd43b;
        }

        .status-upcoming {
            color: #ff922b;
        }

        .status-warning {
            color: #ff6b6b;
            font-weight: bold;
            animation: blink 1s infinite;
        }

        .status-ended {
            color: #868e96;
        }

        .schedule-item {
            background: #111;
            padding: 8px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            border-left: 3px solid #4e73df;
        }

        .sch-time {
            color: #63e6be;
            font-weight: bold;
            font-family: monospace;
        }

        .sch-theater {
            color: #adb5bd;
            font-size: 0.75rem;
            margin-right: 5px;
        }

        .sch-title {
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin: 0 8px;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        .announcement {
            margin-top: 15px;
            padding: 10px;
            background: #2b2f33;
            border-radius: 8px;
            font-size: 0.9rem;
            border-left: 4px solid #ff6b6b;
        }

        .refresh-btn {
            width: 100%;
            padding: 12px;
            background: #333;
            border: none;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        .sch-btn {
            background: #4e73df;
            margin-bottom: 10px;
            margin-top: 20px;
        }

        .movie-item:active {
            background: #333;
        }

        #detail-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            width: 100%;
            max-width: 280px;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: bold;
            color: #63e6be;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            text-align: center;
        }

        .modal-body {
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .modal-btn {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .schedule-item {
            background: #111;
            padding: 8px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            border-left: 3px solid #4e73df;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3 id="view-title">현장 운영 상황 (Pro)</h3>
        <!-- <div id="loading">데이터 불러오는 중...</div> -->

        <!-- 현황 뷰 -->
        <div id="movie-list" class="movie-list"></div>

        <!-- 시간표 뷰 (초기 숨김) -->
        <div id="schedule-list" class="movie-list" style="display:none;"></div>

        <div id="announcement" class="announcement" style="display:none;"></div>

        <!-- 상세 정보 팝업 (모달) 추가 -->
        <div id="detail-modal">
            <div class="modal-content">
                <div id="detail-modal-title" class="modal-title">상세 정보</div>
                <div id="detail-modal-body" class="modal-body">
                    <!-- 데이터 동적 삽입 -->
                </div>
                <button onclick="closeDetailModal()" class="modal-btn">닫기</button>
            </div>
        </div>

        <button id="toggle-btn" class="refresh-btn sch-btn" onclick="toggleView()">📅 전체 시간표 보기</button>
        <button id="refresh-btn" class="refresh-btn" onclick="fetchData()">🔄 새로고침</button>

        <div style="font-size: 0.7rem; color: #444; text-align: center; margin-top: 10px;" id="last-update"></div>
    </div>

    <script>
        // [중요] 여기에 본인의 구글 앱스 스크립트 웹 앱 주소를 넣어주세요!
        // 주소 끝에 ?action=data 가 붙어야 합니다.
        const APP_URL = "https://script.google.com/macros/s/AKfycbw10GvgsGEf7LVY5FPqY2m9aeDv6lCyJk7VQGDdNQfUHoylvBwtqVqxTMJdem2znHMG/exec";
        let cachedData = null;
        let isScheduleView = false;

        async function fetchData() {
            if (!APP_URL || APP_URL.includes("실제_배포된")) {
                alert("배포된 웹 앱 주소를 설정해주세요!");
                return;
            }

            const loading = document.getElementById('loading');
            // loading.style.display = 'block';

            // CORS 문제를 피하기 위해 JSONP 방식을 사용합니다.
            const callbackName = 'jsonpCallback_' + Math.round(100000 * Math.random());
            const script = document.createElement('script');

            window[callbackName] = function (data) {
                cachedData = data;
                renderUI();
                delete window[callbackName];
                document.body.removeChild(script);
                // if (loading) loading.style.display = 'none';
                document.getElementById('last-update').innerText = "Last Update: " + new Date().toLocaleTimeString();
            };

            script.src = APP_URL + (APP_URL.indexOf('?') >= 0 ? '&' : '?') + 'action=data&callback=' + callbackName;
            script.onerror = function () {
                loading.innerText = "서버 통신 오류 (권한 또는 주소 확인 필요)";
                document.body.removeChild(script);
            };
            document.body.appendChild(script);
        }

        function toggleView() {
            isScheduleView = !isScheduleView;
            renderUI();
        }

        function renderUI() {
            if (!cachedData) return;
            const data = cachedData;

            const movieListBox = document.getElementById('movie-list');
            const scheduleListBox = document.getElementById('schedule-list');
            const toggleBtn = document.getElementById('toggle-btn');
            const viewTitle = document.getElementById('view-title');

            if (isScheduleView) {
                movieListBox.style.display = 'none';
                scheduleListBox.style.display = 'flex';
                toggleBtn.innerText = "🏠 현재 현황 보기";
                viewTitle.innerText = "전체 시간표 (시작순)";
                renderSchedule(data.allMovies);
            } else {
                movieListBox.style.display = 'flex';
                scheduleListBox.style.display = 'none';
                toggleBtn.innerText = "📅 전체 시간표 보기";
                viewTitle.innerText = "현장 운영 상황 (Pro)";
                renderStatus(data.movies, data.now);
            }

            // 전달사항 (공통)
            const announceBox = document.getElementById('announcement');
            if (data.announcement && (data.announcement.length > 0 || typeof data.announcement === 'object')) {
                const latest = Array.isArray(data.announcement) ? data.announcement[0] : data.announcement;
                let msg = typeof latest === 'string' ? latest : (latest.text || "내용 없음");
                let time = latest.time ? " [" + latest.time + "]" : "";
                announceBox.innerText = "📢 " + msg + time;
                announceBox.style.display = 'block';
            } else {
                announceBox.style.display = 'none';
            }
        }

        function renderStatus(movies, now) {
            let html = '';
            for (let i = 1; i <= 6; i++) {
                let th = i + "관";
                let info = movies[th];
                let stClass = 'status-ended';
                let stText = '상영 종료';

                if (!info || info.status === 'empty') {
                    html += `
                    <div class="movie-item">
                        <div style="display: flex; justify-content: space-between; width: 100%;">
                            <span class="room-name">${th}</span>
                            <span class="${stClass}">일정 없음</span>
                        </div>
                    </div>`;
                    continue;
                }

                if (info.status === 'running') {
                    let remain = info.end - now;
                    if (remain <= 10 && remain >= 0) {
                        stClass = "status-warning";
                        stText = `퇴출임박 (${remain}분)`;
                    } else if (remain <= 20) {
                        stClass = "status-upcoming";
                        stText = `곧종료 (${remain}분)`;
                    } else {
                        stClass = "status-running";
                        stText = `상영중 (${remain}분 남음)`;
                    }
                } else if (info.status === 'advertising') {
                    let remainAd = info.start - now;
                    stClass = "status-ad";
                    stText = `광고중 (${remainAd}분 후 상영)`;
                } else if (info.status === 'ended') {
                    stClass = "status-ended";
                    stText = `종료 됨 (발권X)`;
                } else if (info.status === 'upcoming') {
                    stClass = "status-ended";
                    stText = `대기중 (${info.tkStr || "?"})`;
                }

                let movieTitle = info.movieName ? info.movieName : "영화 정보 없음";
                let audience = (info.audienceCnt && info.audienceCnt !== "0") ? info.audienceCnt + "명" : "0명";

                html += `
                <div class="movie-item" onclick="showTheaterDetail('${th}')" style="cursor:pointer;">
                    <div style="display: flex; justify-content: space-between; width: 100%;">
                        <span class="room-name">${th}</span>
                        <span class="${stClass}">${stText}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; width: 100%; font-size: 0.9rem; color: #ced4da; margin-top:4px;">
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%;">${movieTitle}</span>
                        <span style="color: #63e6be; font-weight: bold;">👤 ${audience}</span>
                    </div>
                </div>`;
            }
            document.getElementById('movie-list').innerHTML = html;
        }

        /**
         * 상영관 상세 팝업 표시 (워치 외부용)
         */
        function showTheaterDetail(hallName) {
            if (!cachedData || !cachedData.movies[hallName]) return;
            const info = cachedData.movies[hallName];
            const body = document.getElementById('detail-modal-body');

            let html = `
                <div style="color:#adb5bd; font-size:0.8rem; margin-bottom:6px; text-align:center;">${hallName} | ${info.movieName || '정보 없음'}</div>
                <div style="background:#222; border-radius:10px; padding:12px; margin-bottom:10px;">
                    <div style="display:flex; justify-content:space-between;">
                        <span>전체 입장객</span>
                        <span style="color:#63e6be; font-weight:bold;">👤 ${info.audienceCnt || '0'}명</span>
                    </div>
                </div>
            `;

            body.innerHTML = html;
            document.getElementById('detail-modal-title').innerText = `${hallName} 상세 현황`;
            document.getElementById('detail-modal').style.display = 'flex';
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        function renderSchedule(allMovies) {
            if (!allMovies) return;

            // 시작 시간 순 정렬
            const sorted = [...allMovies].sort((a, b) => a.start - b.start);

            let html = '';
            sorted.forEach(m => {
                let movieTitle = m.movieName ? m.movieName : "영화 정보 없음";
                let audience = m.audienceCnt ? m.audienceCnt : "0";

                html += `
                <div class="schedule-item" style="padding: 10px 8px; gap: 5px;">
                    <div style="display: flex; flex-direction: column; min-width: 55px; line-height: 1.2;">
                        <span class="sch-time">${m.tkStr}</span>
                        <span style="font-size: 0.7rem; color: #868e96;">~${m.endStr}</span>
                    </div>
                    <span class="sch-title" style="font-size: 0.95rem; margin: 0;">${movieTitle}</span>
                    <div style="display: flex; flex-direction: column; align-items: flex-end; min-width: 42px; line-height: 1.2;">
                        <span class="sch-theater" style="margin: 0;">${m.theater.replace("관", "")}관</span>
                        <span style="font-size: 0.75rem; color: #63e6be; font-weight: bold;">👤${audience}</span>
                    </div>
                </div>`;
            });
            document.getElementById('schedule-list').innerHTML = html || '<div style="text-align:center; padding:20px; color:#868e96;">일정 없음</div>';
        }

        // 초기 실행 및 45초 주기로 갱신
        fetchData();
        setInterval(fetchData, 45000);
    </script>
</body>

</html>
